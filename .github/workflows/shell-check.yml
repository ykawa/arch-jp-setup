name: Shell Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check
        run: git ls-files -z '*.sh' .githooks/pre-commit | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' .githooks/pre-commit | xargs -0 shellcheck -x -S warning

      # 版によって整形結果が変わるので固定する
      - name: Install shfmt
        env:
          SHFMT_VERSION: v3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shfmt" \
            "https://github.com/mvdan/sh/releases/download/$SHFMT_VERSION/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "$SHFMT_SHA256  $RUNNER_TEMP/shfmt" | sha256sum -c -
          sudo install -m 755 "$RUNNER_TEMP/shfmt" /usr/local/bin/shfmt

      # -d は差分を表示して失敗するだけで、ファイルは書き換えない
      - name: shfmt
        run: git ls-files -z '*.sh' .githooks/pre-commit | xargs -0 shfmt -d
