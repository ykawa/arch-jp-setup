name: Shell Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check
        run: git ls-files -z '*.sh' .githooks/pre-commit | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' .githooks/pre-commit | xargs -0 shellcheck -x -S warning
