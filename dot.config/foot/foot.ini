# Omarchy (basecamp/omarchy config/foot/foot.ini) に準拠。テーマ・フォントのみ独自 (アイコン用に Nerd Font をフォールバック指定)

[main]
include=~/.config/foot/themes/noctalia
# alacritty→zellij と同じく、foot は tmux の Work セッションで開く（コマンドを渡したときはそのコマンドを実行）
shell=tmux new -A -s Work
term=xterm-256color
font=Source Han Code JP R:size=11.75,JetBrainsMono Nerd Font Mono:size=11.75
pad=14x14
initial-window-mode=windowed
# workers=0  # 0だとシングルスレッド描画になり遅く、niri上で buffer release 警告も出るため既定値(論理CPU数)に戻した

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[colors-dark]
alpha=0.8

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
