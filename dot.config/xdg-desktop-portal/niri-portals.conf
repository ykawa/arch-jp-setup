[preferred]
# Default backend for niri session
default=gtk
# ScreenCast: niri implements org.gnome.Mutter.ScreenCast, so use the gnome backend
# (xdg-desktop-portal-wlr on niri yields streams with no frames -> 0-byte recordings)
org.freedesktop.impl.portal.ScreenCast=gnome
# Screenshot: wlr backend (wlr-screencopy-v1) works with niri
org.freedesktop.impl.portal.Screenshot=wlr
